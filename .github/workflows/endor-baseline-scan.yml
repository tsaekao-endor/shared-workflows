name: Endor Labs Baseline Scan (Reusable)

on:
  workflow_call:
    inputs:
      namespace:
        description: 'Endor Labs namespace to scan into'
        required: true
        type: string
      languages:
        description: 'Comma-separated list of languages to scan (e.g. c,python or csharp)'
        required: false
        type: string
        default: ''

jobs:
  baseline-scan:
    name: Baseline Scan
    runs-on: ubuntu-latest

    permissions:
      id-token: write   # Required for keyless OIDC authentication with Endor Labs
      contents: read    # Required to check out the repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1

      - name: Endor Labs Baseline Scan
        uses: endorlabs/github-action@b8992820cc4d9c9e7ded5022adf6cabe2dc11946 # v1.1.12
        with:
          namespace: ${{ inputs.namespace }}
          pr: false
          scan_dependencies: true
          scan_secrets: true
          scan_git_logs: true
          scan_github_actions: false
          scan_summary_output_type: 'table'
          additional_args: ${{ inputs.languages != '' && format('--languages={0}', inputs.languages) || '' }}

  # ── PR scan (coming soon) ──────────────────────────────────────────────────
  # To enable PR comments, uncomment and adapt the pr-scan job in the
  # calling workflow. The PR scan job requires pull-requests: write permission
  # and must set pr: true and enable_pr_comments: true.
