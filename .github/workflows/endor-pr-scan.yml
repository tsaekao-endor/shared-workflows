name: Endor Labs PR Scan (Reusable)

on:
  workflow_call:
    inputs:
      namespace:
        description: 'Endor Labs namespace to scan into'
        required: true
        type: string
      languages:
        description: 'Comma-separated list of languages to scan (e.g. c,python or csharp)'
        required: false
        type: string
        default: ''

jobs:
  pr-scan:
    name: PR Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1

      - name: Endor Labs PR Scan
        uses: endorlabs/github-action@b8992820cc4d9c9e7ded5022adf6cabe2dc11946 # v1.1.12
        with:
          namespace: ${{ inputs.namespace }}
          pr: true
          enable_pr_comments: true
          github_token: ${{ github.token }}
          scan_dependencies: true
          scan_secrets: true
          scan_github_actions: false
          scan_summary_output_type: 'table'
          additional_args: ${{ inputs.languages != '' && format('--languages={0}', inputs.languages) || '' }}
